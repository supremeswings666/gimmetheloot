<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | Gimmetheloot</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { margin: 0; background-color: #080808; color: #ffffff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
.container { max-width: 1280px; margin: 0 auto; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255, 0, 51, 0.3); }
.logo { font-size: 32px; font-weight: 900; color: #ff0033; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 0, 51, 0.8); cursor: pointer; }
.nav a { color: #ccc; text-decoration: none; margin-left: 30px; font-weight: 700; transition: 0.3s; font-size: 14px; text-transform: uppercase; }
.nav a:hover { color: #ff0033; text-shadow: 0 0 10px #ff0033; }
.btn-glow { background: linear-gradient(45deg, #ff0033, #80001a); border: 1px solid #ff0033; color: white; padding: 16px 32px; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 51, 0.5); transition: 0.3s; text-transform: uppercase; }
.btn-glow:hover { box-shadow: 0 0 40px rgba(255, 0, 51, 0.9); transform: translateY(-2px); }
.title { font-size: 32px; font-weight: 900; margin-top: 0; margin-bottom: 20px; }
.title span { color: #ff0033; text-shadow: 0 0 20px rgba(255,0,51,0.5); }
.glass-card { background: rgba(20, 0, 0, 0.4); border: 1px solid rgba(255, 0, 51, 0.3); border-radius: 16px; padding: 30px; backdrop-filter: blur(12px); }
.form-group { margin-bottom: 20px; text-align: left; }
.form-group label { display: block; margin-bottom: 8px; color: #aaa; font-weight: 700; font-size: 12px; text-transform: uppercase; }
.form-group input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,0,51,0.3); border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; outline: none; transition: 0.3s; }
.form-group input:focus { border-color: #ff0033; box-shadow: 0 0 15px rgba(255,0,51,0.3); }
.footer { text-align: center; padding: 40px 0; color: #444; border-top: 1px solid rgba(255,0,51,0.2); margin-top: 80px; font-weight: 700; font-size: 12px; text-transform: uppercase; }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo" onclick="window.location.href='01home.html'">GIMMETHELOOT</div>
            <div class="nav">
                <a href="01home.html">Главная</a>
                <a href="02catalog.html">Каталог</a>
                <a href="06profile.html">Профиль</a>
                <a href="09cart.html">Корзина</a>

        </div>
        <div class="content" style="min-height: 65vh; padding: 60px 0;">
            <div style="display: flex; gap: 40px;">
                <div style="width: 300px;">
                    <div class="glass-card" style="text-align: left;">
                        <div style="width: 80px; height: 80px; background: #ff0033; border-radius: 50%; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold;">U</div>
                        <h3 style="margin: 0 0 5px 0;">User_7734</h3>
                        <p style="color: #999; margin: 0 0 20px 0; font-size: 14px;">user@example.com</p>
                        <div style="padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <div style="color: #aaa; font-size: 12px; text-transform: uppercase;">Баланс</div>
                            <div style="font-size: 24px; font-weight: 900; color: #ff0033;">12 400 ₽</div>
                        </div>
                    </div>
                </div>
                <div style="flex: 1;">
                    <h2 class="title">НАСТРОЙКИ <span>ПРОФИЛЯ</span></h2>
                    <div class="glass-card" style="text-align: left; padding: 40px;">
                        <div class="form-group">
                            <label>Имя пользователя</label>
                            <input type="text" value="User_7734">
                        </div>
                        <div class="form-group">
                            <label>Email для чеков</label>
                            <input type="email" value="user@example.com">
                        </div>
                        <div class="form-group">
                            <label>Новый пароль</label>
                            <input type="password" placeholder="••••••••">
                        </div>
                        <button class="btn-glow" style="margin-top: 20px;">Сохранить изменения</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            &copy; 2026 Gimmetheloot. Проект "Секретные коробки". UI Design.
        </div>
    </div>
</body>
</html>

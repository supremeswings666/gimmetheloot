<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат | Gimmetheloot</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
body { margin: 0; background-color: #080808; color: #ffffff; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
.container { max-width: 1280px; margin: 0 auto; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255, 0, 51, 0.3); }
.logo { font-size: 32px; font-weight: 900; color: #ff0033; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255, 0, 51, 0.8), 0 0 30px rgba(255, 0, 51, 0.4); cursor: pointer; }
.nav a { color: #ccc; text-decoration: none; margin-left: 30px; font-weight: 700; transition: 0.3s; font-size: 14px; text-transform: uppercase; }
.nav a:hover { color: #ff0033; text-shadow: 0 0 10px #ff0033; }
.btn-glow { background: linear-gradient(45deg, #ff0033, #80001a); border: 1px solid #ff0033; color: white; padding: 16px 32px; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 51, 0.5); transition: 0.3s; text-transform: uppercase; }
.btn-glow:hover { box-shadow: 0 0 40px rgba(255, 0, 51, 0.9); transform: translateY(-2px); }
.title { font-size: 56px; font-weight: 900; margin-bottom: 20px; line-height: 1.1; }
.title span { color: #ff0033; text-shadow: 0 0 20px rgba(255,0,51,0.5); }
.glass-card { background: rgba(20, 0, 0, 0.4); border: 1px solid rgba(255, 0, 51, 0.3); border-radius: 16px; padding: 30px; backdrop-filter: blur(12px); text-align: center; }
.footer { text-align: center; padding: 40px 0; color: #444; border-top: 1px solid rgba(255,0,51,0.2); margin-top: 80px; font-weight: 700; font-size: 12px; text-transform: uppercase; }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo" onclick="window.location.href='01home.html'">GIMMETHELOOT</div>
            <div class="nav">
                <a href="01home.html">Главная</a>
                <a href="02catalog.html">Каталог</a>
                <a href="06profile.html">Профиль</a>
                <a href="09cart.html">Корзина</a>
            </div>
        </div>
        <div class="content" style="min-height: 65vh; padding: 60px 0;">
            <div style="text-align: center; padding: 40px 0;">
                <div style="display: inline-block; padding: 10px 20px; background: rgba(255,204,0,0.2); border: 1px solid #ffcc00; color: #ffcc00; border-radius: 8px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;">Legendary Drop</div>
                <h1 class="title" style="font-size: 56px; margin-bottom: 40px;">МЕХАНИЧЕСКАЯ <br><span>КЛАВИАТУРА</span></h1>
                
                <div style="position: relative; width: 300px; height: 300px; margin: 0 auto 50px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(255,204,0,0.3) 0%, transparent 70%);">
                    <div class="glass-card" style="width: 100%; height: 100%; border-color: #ffcc00; box-shadow: 0 0 50px rgba(255,204,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 80px;">
                        ⌨️
                    </div>
                </div>
                
                <div style="display: flex; justify-content: center; gap: 20px;">
                    <button class="btn-glow" style="background: transparent; border: 1px solid #ff0033;" onclick="window.location.href='07inventory.html'">В инвентарь</button>
                    <button class="btn-glow" onclick="window.location.href='02catalog.html'">Открыть еще</button>
                </div>
            </div>
        </div>
        <div class="footer">
            &copy; 2026 Gimmetheloot. Проект "Секретные коробки". UI Design.
        </div>
    </div>
</body>
</html>
